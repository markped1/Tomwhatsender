<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TomWhatsBulk License Manager</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    font-size: 12px;
    background: #f0f0f0;
    color: #000;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Title Bar ── */
  #title-bar {
    background: #003087;
    color: #fff;
    padding: 6px 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  #title-bar .app-icon {
    width: 20px; height: 20px;
    background: #fff;
    border-radius: 2px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; color: #003087; font-weight: bold;
  }
  #title-bar .title-text { font-size: 13px; font-weight: 600; }
  #title-bar .subtitle { font-size: 11px; opacity: 0.75; margin-left: 4px; }

  /* ── Menu Bar ── */
  #menu-bar {
    background: #f0f0f0;
    border-bottom: 1px solid #adadad;
    display: flex;
    align-items: stretch;
    flex-shrink: 0;
    height: 22px;
  }
  .menu-item {
    padding: 3px 10px;
    cursor: pointer;
    display: flex; align-items: center;
    font-size: 12px;
    position: relative;
  }
  .menu-item:hover { background: #316ac5; color: #fff; }
  .menu-item:focus { outline: 1px dotted #000; }

  /* ── Toolbar ── */
  #toolbar {
    background: #f0f0f0;
    border-bottom: 2px solid #adadad;
    padding: 3px 6px;
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
  }
  .tb-sep {
    width: 1px; height: 22px;
    background: #adadad;
    margin: 0 4px;
  }
  .tb-btn {
    background: #f0f0f0;
    border: 1px solid #adadad;
    padding: 2px 8px;
    cursor: pointer;
    font-size: 12px;
    font-family: 'Segoe UI', sans-serif;
    display: flex; align-items: center; gap: 4px;
    height: 24px;
    white-space: nowrap;
  }
  .tb-btn:hover { background: #e5f3ff; border-color: #0078d7; }
  .tb-btn:active { background: #cce4f7; border-color: #0078d7; box-shadow: inset 1px 1px 2px rgba(0,0,0,0.15); }
  .tb-btn .icon { font-size: 13px; }

  select.tb-select {
    background: #fff;
    border: 1px solid #adadad;
    padding: 2px 4px;
    font-size: 12px;
    font-family: 'Segoe UI', sans-serif;
    height: 24px;
    cursor: pointer;
  }
  select.tb-select:focus { outline: 1px solid #0078d7; }

  label.tb-label { font-size: 12px; }

  /* ── Generate Panel ── */
  #gen-panel {
    background: #fff;
    border: 1px solid #adadad;
    border-top: none;
    padding: 6px 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
    border-bottom: 1px solid #adadad;
  }
  #gen-panel label { font-size: 12px; }
  #last-key-box {
    display: flex; align-items: center; gap: 6px;
    margin-left: 16px;
  }
  #last-key-box span { font-size: 12px; color: #555; }
  #last-key-val {
    font-family: 'Courier New', monospace;
    font-size: 12px;
    background: #f5f5f5;
    border: 1px solid #ccc;
    padding: 2px 6px;
    min-width: 220px;
    color: #000;
  }

  /* ── Main Content ── */
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: #fff;
    border: 1px solid #adadad;
    margin: 4px;
  }

  /* ── Table ── */
  #table-wrap {
    flex: 1;
    overflow-y: auto;
    overflow-x: auto;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }
  thead tr {
    background: #f0f0f0;
    border-bottom: 2px solid #adadad;
  }
  thead th {
    padding: 4px 8px;
    text-align: left;
    font-weight: 600;
    border-right: 1px solid #d4d4d4;
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
  }
  thead th:hover { background: #e0e0e0; }
  thead th:last-child { border-right: none; }

  tbody tr { border-bottom: 1px solid #e8e8e8; }
  tbody tr:hover { background: #e5f3ff; }
  tbody tr.selected { background: #cce4f7; }
  tbody td {
    padding: 3px 8px;
    border-right: 1px solid #f0f0f0;
    white-space: nowrap;
    vertical-align: middle;
  }
  tbody td:last-child { border-right: none; }

  .key-mono {
    font-family: 'Courier New', monospace;
    font-size: 11px;
    letter-spacing: 0.5px;
  }

  /* ── Status Pills ── */
  .badge {
    display: inline-block;
    padding: 1px 7px;
    font-size: 11px;
    font-weight: 600;
    border: 1px solid;
    border-radius: 2px;
  }
  .badge-available { background: #dff0d8; color: #2d6a2d; border-color: #5cb85c; }
  .badge-inuse     { background: #d0e8ff; color: #004a99; border-color: #0078d7; }
  .badge-revoked   { background: #fde8e8; color: #a00; border-color: #d9534f; }

  /* ── Action Buttons ── */
  .act-btn {
    background: #f0f0f0;
    border: 1px solid #adadad;
    padding: 1px 7px;
    cursor: pointer;
    font-size: 11px;
    font-family: 'Segoe UI', sans-serif;
    margin-right: 3px;
  }
  .act-btn:hover { background: #e5f3ff; border-color: #0078d7; }
  .act-btn:active { background: #cce4f7; }
  .act-btn.danger:hover { background: #fde8e8; border-color: #d9534f; color: #a00; }
  .act-btn.restore:hover { background: #dff0d8; border-color: #5cb85c; color: #2d6a2d; }

  /* ── Pagination ── */
  #pagination {
    background: #f0f0f0;
    border-top: 1px solid #adadad;
    padding: 4px 8px;
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
  }
  .pg-btn {
    background: #f0f0f0;
    border: 1px solid #adadad;
    padding: 1px 8px;
    cursor: pointer;
    font-size: 12px;
    font-family: 'Segoe UI', sans-serif;
    min-width: 28px;
    text-align: center;
  }
  .pg-btn:hover { background: #e5f3ff; border-color: #0078d7; }
  .pg-btn.active { background: #0078d7; color: #fff; border-color: #005fa3; }
  .pg-btn:disabled { color: #aaa; cursor: default; background: #f0f0f0; }
  #pg-info { font-size: 12px; color: #555; margin-left: 8px; }

  /* ── Status Bar ── */
  #status-bar {
    background: #f0f0f0;
    border-top: 2px solid #adadad;
    padding: 3px 10px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
    font-size: 12px;
  }
  .sb-item { display: flex; align-items: center; gap: 4px; }
  .sb-sep { width: 1px; height: 14px; background: #adadad; }
  .sb-val { font-weight: 600; }
  #sb-msg { margin-left: auto; color: #555; font-style: italic; }

  /* ── Loading overlay ── */
  #loading {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,0.7);
    align-items: center;
    justify-content: center;
    font-size: 13px;
    color: #003087;
    z-index: 100;
  }
  #loading.show { display: flex; }

  /* ── Empty state ── */
  #empty-row td {
    text-align: center;
    padding: 20px;
    color: #888;
    font-style: italic;
  }

  /* scrollbar */
  ::-webkit-scrollbar { width: 14px; height: 14px; }
  ::-webkit-scrollbar-track { background: #f0f0f0; }
  ::-webkit-scrollbar-thumb { background: #c0c0c0; border: 1px solid #adadad; }
  ::-webkit-scrollbar-thumb:hover { background: #a0a0a0; }
</style>
</head>
<body>

<!-- Title Bar -->
<div id="title-bar">
  <div class="app-icon">&#128273;</div>
  <span class="title-text">TomWhatsBulk License Manager</span>
  <span class="subtitle">— Admin Panel</span>
</div>

<!-- Menu Bar -->
<div id="menu-bar">
  <div class="menu-item" tabindex="0">File</div>
  <div class="menu-item" tabindex="0">Keys</div>
  <div class="menu-item" tabindex="0">Help</div>
</div>

<!-- Toolbar -->
<div id="toolbar">
  <label class="tb-label">Qty:</label>
  <select id="qty-select" class="tb-select">
    <option value="1">1</option>
    <option value="5">5</option>
    <option value="10" selected>10</option>
    <option value="25">25</option>
    <option value="50">50</option>
    <option value="100">100</option>
  </select>
  <button class="tb-btn" onclick="generateKeys()">
    <span class="icon">&#10010;</span> Generate Keys
  </button>
  <div class="tb-sep"></div>
  <button class="tb-btn" onclick="loadKeys()">
    <span class="icon">&#8635;</span> Refresh
  </button>
  <div class="tb-sep"></div>
  <label class="tb-label">Filter:</label>
  <select id="filter-select" class="tb-select" onchange="applyFilter()">
    <option value="all">All Keys</option>
    <option value="available">Available</option>
    <option value="inuse">In Use</option>
    <option value="revoked">Revoked</option>
  </select>
</div>

<!-- Generate Result Panel -->
<div id="gen-panel">
  <span style="color:#555;">Last generated:</span>
  <div id="last-key-box">
    <span id="last-key-val" style="font-family:'Courier New',monospace;font-size:12px;background:#f5f5f5;border:1px solid #ccc;padding:2px 8px;min-width:240px;display:inline-block;color:#888;">— none —</span>
    <button class="act-btn" onclick="copyKey(document.getElementById('last-key-val').textContent)" title="Copy to clipboard">&#128203; Copy</button>
    <span id="gen-status" style="color:#555;font-style:italic;"></span>
  </div>
</div>

<!-- Main Content -->
<div id="main" style="position:relative;">
  <div id="loading">&#9203; Loading keys…</div>
  <div id="table-wrap">
    <table id="keys-table">
      <thead>
        <tr>
          <th style="width:36px;">#</th>
          <th style="min-width:220px;">Serial Key</th>
          <th style="width:80px;">Status</th>
          <th style="width:130px;">Created Date</th>
          <th style="width:130px;">Went Live</th>
          <th style="min-width:280px;">Machine ID</th>
          <th style="width:130px;">Actions</th>
        </tr>
      </thead>
      <tbody id="keys-tbody">
        <tr id="empty-row"><td colspan="7">No keys loaded. Click Refresh to load.</td></tr>
      </tbody>
    </table>
  </div>

  <!-- Pagination -->
  <div id="pagination">
    <button class="pg-btn" id="btn-prev" onclick="goPage(currentPage - 1)">&#9664; Prev</button>
    <span id="pg-numbers"></span>
    <button class="pg-btn" id="btn-next" onclick="goPage(currentPage + 1)">Next &#9654;</button>
    <span id="pg-info"></span>
  </div>
</div>

<!-- Status Bar -->
<div id="status-bar">
  <div class="sb-item">Total: <span class="sb-val" id="sb-total">0</span></div>
  <div class="sb-sep"></div>
  <div class="sb-item" style="color:#2d6a2d;">Available: <span class="sb-val" id="sb-available">0</span></div>
  <div class="sb-sep"></div>
  <div class="sb-item" style="color:#004a99;">In Use: <span class="sb-val" id="sb-inuse">0</span></div>
  <div class="sb-sep"></div>
  <div class="sb-item" style="color:#a00;">Revoked: <span class="sb-val" id="sb-revoked">0</span></div>
  <span id="sb-msg">Ready</span>
</div>

<script>
  // ── Supabase Config ──────────────────────────────────────────────────────────
  const SUPA_URL  = 'https://lcjrzupdwanyzuyshqul.supabase.co';
  const SUPA_KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxjanJ6dXBkd2FueXp1eXNocXVsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4MDEwMjcsImV4cCI6MjA5MDM3NzAyN30.GUVYLkK2691gIeV9s2Wfs1gEzY-KXjQxn1dcdm9Q_uA';
  const TABLE     = 'licenses';
  const PAGE_SIZE = 15;

  // ── State ────────────────────────────────────────────────────────────────────
  let allKeys     = [];   // raw from Supabase
  let filtered    = [];   // after filter applied
  let currentPage = 1;

  // ── Helpers ──────────────────────────────────────────────────────────────────
  function seg() {
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
    let s = '';
    for (let i = 0; i < 5; i++) s += chars[Math.floor(Math.random() * chars.length)];
    return s;
  }

  function randomKey() {
    return `${seg()}-${seg()}-${seg()}-${seg()}`;
  }

  function fmtDate(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    if (isNaN(d)) return '—';
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const dd   = String(d.getDate()).padStart(2, '0');
    const mon  = months[d.getMonth()];
    const yyyy = d.getFullYear();
    const hh   = String(d.getHours()).padStart(2, '0');
    const mm   = String(d.getMinutes()).padStart(2, '0');
    return `${dd} ${mon} ${yyyy} ${hh}:${mm}`;
  }

  function setMsg(msg) {
    document.getElementById('sb-msg').textContent = msg;
  }

  function setLoading(on) {
    document.getElementById('loading').classList.toggle('show', on);
  }

  // ── Supabase REST helpers ─────────────────────────────────────────────────────
  async function sbFetch(path, method = 'GET', body = null, extra = {}) {
    const headers = {
      'apikey':        SUPA_KEY,
      'Authorization': `Bearer ${SUPA_KEY}`,
      'Content-Type':  'application/json',
      'Prefer':        'return=representation',
      ...extra
    };
    const opts = { method, headers };
    if (body) opts.body = JSON.stringify(body);
    const res = await fetch(`${SUPA_URL}/rest/v1/${path}`, opts);
    if (!res.ok) {
      const err = await res.text();
      throw new Error(`Supabase ${method} ${path}: ${res.status} — ${err}`);
    }
    const text = await res.text();
    return text ? JSON.parse(text) : null;
  }

  // ── Generate Keys ─────────────────────────────────────────────────────────────
  async function generateKeys() {
    const qty = parseInt(document.getElementById('qty-select').value, 10);
    setMsg(`Generating ${qty} key(s)…`);
    setLoading(true);
    try {
      const now = new Date().toISOString();
      const rows = [];
      for (let i = 0; i < qty; i++) {
        rows.push({
          id:         randomKey(),
          active:     true,
          machine_id: null,
          claimed_at: null,
          created_at: now
        });
      }
      await sbFetch(TABLE, 'POST', rows);
      const lastKey = rows[rows.length - 1].id;
      document.getElementById('last-key-val').textContent = lastKey;
      document.getElementById('gen-status').textContent = `✔ ${qty} key(s) generated`;
      setMsg(`Generated ${qty} key(s) successfully.`);
      await loadKeys();
    } catch (e) {
      document.getElementById('gen-status').textContent = '✖ Error: ' + e.message;
      setMsg('Error generating keys.');
      console.error(e);
    } finally {
      setLoading(false);
    }
  }

  // ── Load Keys ─────────────────────────────────────────────────────────────────
  async function loadKeys() {
    setLoading(true);
    setMsg('Loading keys…');
    try {
      const data = await sbFetch(`${TABLE}?order=created_at.desc&limit=5000`);
      allKeys = data || [];
      applyFilter();
      updateStatusBar();
      setMsg(`Loaded ${allKeys.length} key(s).`);
    } catch (e) {
      setMsg('Error loading keys: ' + e.message);
      console.error(e);
    } finally {
      setLoading(false);
    }
  }

  // ── Filter ────────────────────────────────────────────────────────────────────
  function applyFilter() {
    const f = document.getElementById('filter-select').value;
    if (f === 'available') {
      filtered = allKeys.filter(k => k.active && !k.machine_id);
    } else if (f === 'inuse') {
      filtered = allKeys.filter(k => k.active && k.machine_id);
    } else if (f === 'revoked') {
      filtered = allKeys.filter(k => !k.active);
    } else {
      filtered = [...allKeys];
    }
    currentPage = 1;
    renderTable();
    renderPagination();
  }

  // ── Render Table ──────────────────────────────────────────────────────────────
  function renderTable() {
    const tbody = document.getElementById('keys-tbody');
    tbody.innerHTML = '';

    if (filtered.length === 0) {
      tbody.innerHTML = '<tr id="empty-row"><td colspan="7">No keys match the current filter.</td></tr>';
      return;
    }

    const start = (currentPage - 1) * PAGE_SIZE;
    const end   = Math.min(start + PAGE_SIZE, filtered.length);
    const page  = filtered.slice(start, end);

    page.forEach((k, idx) => {
      const rowNum = start + idx + 1;
      const status = getStatus(k);
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td style="text-align:right;color:#888;">${rowNum}</td>
        <td><span class="key-mono">${escHtml(k.id)}</span></td>
        <td>${badgeHtml(status)}</td>
        <td>${fmtDate(k.created_at)}</td>
        <td>${fmtDate(k.claimed_at)}</td>
        <td style="font-family:'Courier New',monospace;font-size:11px;color:#555;">${k.machine_id ? escHtml(k.machine_id) : '<span style="color:#bbb;">—</span>'}</td>
        <td>${actionsHtml(k, status)}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  function getStatus(k) {
    if (!k.active) return 'revoked';
    if (k.machine_id) return 'inuse';
    return 'available';
  }

  function badgeHtml(status) {
    if (status === 'available') return '<span class="badge badge-available">Available</span>';
    if (status === 'inuse')     return '<span class="badge badge-inuse">In Use</span>';
    return '<span class="badge badge-revoked">Revoked</span>';
  }

  function actionsHtml(k, status) {
    const keyEsc = escAttr(k.id);
    let html = `<button class="act-btn" onclick="copyKey('${keyEsc}')" title="Copy key">&#128203;</button>`;
    if (status === 'revoked') {
      html += `<button class="act-btn restore" onclick="restoreKey('${keyEsc}')" title="Restore key">&#9654; Restore</button>`;
    } else {
      html += `<button class="act-btn danger" onclick="revokeKey('${keyEsc}')" title="Revoke key">&#10006; Revoke</button>`;
    }
    return html;
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function escAttr(s) {
    return String(s).replace(/'/g, '&#39;').replace(/"/g, '&quot;');
  }

  // ── Pagination ────────────────────────────────────────────────────────────────
  function renderPagination() {
    const total = filtered.length;
    const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
    const start = (currentPage - 1) * PAGE_SIZE + 1;
    const end   = Math.min(currentPage * PAGE_SIZE, total);

    document.getElementById('pg-info').textContent =
      total === 0 ? 'No records' : `Showing ${start}–${end} of ${total}`;

    document.getElementById('btn-prev').disabled = currentPage <= 1;
    document.getElementById('btn-next').disabled = currentPage >= pages;

    // Page number buttons — show up to 9 around current
    const nums = document.getElementById('pg-numbers');
    nums.innerHTML = '';

    let lo = Math.max(1, currentPage - 4);
    let hi = Math.min(pages, lo + 8);
    lo = Math.max(1, hi - 8);

    if (lo > 1) {
      nums.appendChild(pgNumBtn(1));
      if (lo > 2) nums.appendChild(pgEllipsis());
    }
    for (let p = lo; p <= hi; p++) nums.appendChild(pgNumBtn(p));
    if (hi < pages) {
      if (hi < pages - 1) nums.appendChild(pgEllipsis());
      nums.appendChild(pgNumBtn(pages));
    }
  }

  function pgNumBtn(p) {
    const b = document.createElement('button');
    b.className = 'pg-btn' + (p === currentPage ? ' active' : '');
    b.textContent = p;
    b.onclick = () => goPage(p);
    return b;
  }
  function pgEllipsis() {
    const s = document.createElement('span');
    s.textContent = '…';
    s.style.cssText = 'padding:0 4px;font-size:12px;';
    return s;
  }

  function goPage(n) {
    const pages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
    if (n < 1 || n > pages) return;
    currentPage = n;
    renderTable();
    renderPagination();
  }

  // ── Status Bar ────────────────────────────────────────────────────────────────
  function updateStatusBar() {
    const total     = allKeys.length;
    const revoked   = allKeys.filter(k => !k.active).length;
    const inuse     = allKeys.filter(k => k.active && k.machine_id).length;
    const available = allKeys.filter(k => k.active && !k.machine_id).length;
    document.getElementById('sb-total').textContent     = total;
    document.getElementById('sb-available').textContent = available;
    document.getElementById('sb-inuse').textContent     = inuse;
    document.getElementById('sb-revoked').textContent   = revoked;
  }

  // ── Key Actions ───────────────────────────────────────────────────────────────
  async function revokeKey(key) {
    if (!confirm(`Revoke key:\n${key}\n\nThis will deactivate the license. Continue?`)) return;
    setMsg('Revoking key…');
    try {
      await sbFetch(`${TABLE}?id=eq.${encodeURIComponent(key)}`, 'PATCH', { active: false });
      setMsg(`Key revoked: ${key}`);
      await loadKeys();
    } catch (e) {
      setMsg('Error revoking key: ' + e.message);
      console.error(e);
    }
  }

  async function restoreKey(key) {
    if (!confirm(`Restore key:\n${key}\n\nThis will re-activate the license. Continue?`)) return;
    setMsg('Restoring key…');
    try {
      await sbFetch(`${TABLE}?id=eq.${encodeURIComponent(key)}`, 'PATCH', { active: true });
      setMsg(`Key restored: ${key}`);
      await loadKeys();
    } catch (e) {
      setMsg('Error restoring key: ' + e.message);
      console.error(e);
    }
  }

  async function copyKey(key) {
    try {
      await navigator.clipboard.writeText(key);
      setMsg(`Copied: ${key}`);
    } catch {
      // fallback
      const ta = document.createElement('textarea');
      ta.value = key;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      setMsg(`Copied: ${key}`);
    }
  }

  // ── Init ──────────────────────────────────────────────────────────────────────
  window.addEventListener('DOMContentLoaded', () => {
    loadKeys();
  });
</script>
</body>
</html>
