appId: com.tomxtractor.whatsappbulk
productName: WhatsApp Bulk Sender
directories:
  buildResources: build
  output: release
files:
  - "!**/.vscode/*"
  - "!src/*"
  - "!.wwebjs_auth/**"
  - "!.wwebjs_cache/**"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
asarUnpack:
  - node_modules/puppeteer/.local-chrome/**
  - node_modules/puppeteer/.local-chromium/**
  - node_modules/node-machine-id/**
  - node_modules/sql.js/dist/sql-wasm.wasm
win:
  executableName: WhatsAppBulkSender
  verifyUpdateCodeSignature: false
  signAndEditExecutable: false
  signExts: []
nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: false
  runAfterFinish: true
  artifactName: WhatsAppBulkSender-Setup.exe
  shortcutName: WhatsApp Bulk Sender
  uninstallDisplayName: WhatsApp Bulk Sender
  createDesktopShortcut: always
npmRebuild: false
nodeGypRebuild: false
nativeRebuilder: sequential
publish:
  provider: generic
  url: https://example.com/auto-updates
